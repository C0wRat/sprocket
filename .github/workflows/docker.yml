# Build the Docker image and publish it to GitHub Container Registry:
#   push to main  -> ghcr.io/<owner>/sprocket:latest (and :sha-<commit>)
#   any git tag   -> ghcr.io/<owner>/sprocket:<tag>
#   pull request  -> built for linux/amd64 only, nothing is pushed
name: Docker image

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        id: name
        # Registry names must be lower case; the repository owner may not be.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=ref,event=tag
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Sprocket
            org.opencontainers.image.description=Web app for scanning 35 mm film with a Plustek OpticFilm scanner

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 for a Raspberry Pi next to the scanner. PRs only check that it builds.
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        # The image starts, serves the page and answers the API (no scanner needed).
        if: github.event_name == 'pull_request'
        run: |
          image=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker run -d --name sprocket -p 8800:8800 "$image"
          for i in $(seq 30); do
            curl -sf http://localhost:8800/api/status && break
            sleep 1
          done
          curl -sf http://localhost:8800/ | grep -q Sprocket
          docker exec sprocket scanimage --version
          docker rm -f sprocket
