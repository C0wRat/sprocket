# PRs are squash-merged, so the title becomes the commit on main and must be a
# Conventional Commit (see CONTRIBUTING.md).
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            test
            docs
            style
            build
            ci
            chore
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: |
            The summary "{subject}" should start with a lower-case letter and not end
            with a full stop, e.g. "fix(imaging): mirror left-right after rotating".
